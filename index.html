<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last.fm Music Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 8px;
      color: #888;
      font-size: 0.95rem;
    }

    .search-box {
      width: 100%;
      max-width: 680px;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #d51007;
    }

    .search-box input::placeholder {
      color: #555;
    }

    .search-box button {
      background: #d51007;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .search-box button:hover { background: #b80d06; }
    .search-box button:disabled { background: #5a0705; cursor: not-allowed; }

    .results {
      width: 100%;
      max-width: 680px;
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .loader {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px 0;
      color: #888;
      font-size: 0.9rem;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2e2e2e;
      border-top-color: #d51007;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 20px 24px;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #d51007;
      margin-bottom: 12px;
    }

    .answer-text {
      line-height: 1.65;
      color: #ddd;
      font-size: 0.97rem;
    }

    .answer-text h2, .answer-text h3 {
      color: #fff;
      font-weight: 600;
      margin: 14px 0 6px;
    }

    .answer-text h2 { font-size: 1rem; }
    .answer-text h3 { font-size: 0.95rem; }

    .answer-text p { margin-bottom: 10px; }
    .answer-text p:last-child { margin-bottom: 0; }

    .answer-text ul, .answer-text ol {
      padding-left: 20px;
      margin-bottom: 10px;
    }

    .answer-text li { margin-bottom: 4px; }

    .answer-text strong { color: #fff; font-weight: 600; }

    .answer-text table {
      margin: 10px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    thead th {
      text-align: left;
      padding: 8px 10px;
      color: #888;
      border-bottom: 1px solid #2e2e2e;
      font-weight: 500;
    }

    tbody td {
      padding: 8px 10px;
      color: #ccc;
      border-bottom: 1px solid #1f1f1f;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #202020; }

    details summary {
      cursor: pointer;
      font-size: 0.8rem;
      color: #666;
      user-select: none;
      list-style: none;
    }

    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "▶  "; font-size: 0.65rem; }
    details[open] summary::before { content: "▼  "; }

    details[open] pre {
      margin-top: 12px;
      background: #111;
      border-radius: 6px;
      padding: 14px 16px;
      font-size: 0.8rem;
      color: #aaa;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .error {
      background: #1e0a0a;
      border: 1px solid #5a1010;
      border-radius: 10px;
      padding: 16px 20px;
      color: #e07070;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Last.fm Music Assistant</h1>
    <p>Ask anything about artists, tracks, albums, or charts</p>
  </header>

  <div class="search-box">
    <input id="queryInput" type="text" placeholder="e.g. top rock artists in the US" />
    <button id="submitBtn" onclick="runQuery()">Ask</button>
  </div>

  <div class="results" id="results">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Querying your music data...</span>
    </div>
  </div>

  <script>
    const API = "http://localhost:8000";

    document.getElementById("queryInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") runQuery();
    });

    async function runQuery() {
      const input = document.getElementById("queryInput");
      const btn = document.getElementById("submitBtn");
      const resultsEl = document.getElementById("results");
      const loader = document.getElementById("loader");
      const query = input.value.trim();

      if (!query) return;

      btn.disabled = true;
      loader.style.display = "flex";
      resultsEl.innerHTML = "";
      resultsEl.appendChild(loader);

      try {
        const res = await fetch(`${API}/query`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_input: query }),
        });

        const data = await res.json();

        if (!res.ok) {
          resultsEl.innerHTML = `<div class="error">Error: ${data.detail || "Something went wrong."}</div>`;
          return;
        }

        resultsEl.innerHTML = "";

        // Answer card
        const answerCard = document.createElement("div");
        answerCard.className = "card";
        answerCard.innerHTML = `
          <div class="card-label">Answer</div>
          <div class="answer-text">${marked.parse(data.answer)}</div>
        `;
        resultsEl.appendChild(answerCard);
        answerCard.scrollIntoView({ behavior: "smooth", block: "start" });

        // Data table card
        if (data.results && data.results.length > 0) {
          const cols = Object.keys(data.results[0]);
          const rows = data.results.map(
            (row) => `<tr>${cols.map((c) => `<td>${escapeHtml(String(row[c] ?? ""))}</td>`).join("")}</tr>`
          ).join("");

          const tableCard = document.createElement("div");
          tableCard.className = "card";
          tableCard.innerHTML = `
            <div class="card-label">Data</div>
            <table>
              <thead><tr>${cols.map((c) => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead>
              <tbody>${rows}</tbody>
            </table>
          `;
          resultsEl.appendChild(tableCard);
        }

        console.debug("Generated SQL:", data.sql);

      } catch (err) {
        resultsEl.innerHTML = `<div class="error">Could not reach the API. Is the server running?</div>`;
      } finally {
        btn.disabled = false;
        loader.style.display = "none";
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>

</body>
</html>
